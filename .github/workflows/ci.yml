name: CI

on: [push, pull_request]

env:
  # Telemetry kill list — docs/06-technology-decisions.md.
  # These belong in CI and the Dockerfile, not on a developer's laptop.
  NEXT_TELEMETRY_DISABLED: '1'
  K6_NO_USAGE_REPORT: '1'
  DO_NOT_TRACK: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install -g pnpm@9
      # No pnpm-lock.yaml is committed yet. Run `pnpm install` once at the repo
      # root and commit pnpm-lock.yaml, then restore --frozen-lockfile here.
      - run: pnpm install
      # `vitest` strips types without checking them, so until this ran the
      # TypeScript in this repo was decorative. `Actor.actorEmploymentId` is a
      # branded type whose whole job is to refuse a bare string; unchecked, it
      # refuses nothing. `pnpm test` also runs typecheck first in each package.
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests (unit + integration, incl. cross-tenant RLS isolation)
        run: pnpm -r test
        env: { PGHOST: localhost, PGPORT: '5433' }

  ai-gateway-boundary:
    # All model access goes through packages/ai. Nothing else may call a model
    # API directly (docs/06-technology-decisions.md §The AI decision).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No model SDK outside packages/ai
        run: |
          if grep -rInE "(openai|anthropic|@google/generative-ai|api\.openai\.com|api\.anthropic\.com)" \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               apps packages --exclude-dir=node_modules \
             | grep -v '^packages/ai/'; then
            echo "::error::Model API accessed outside packages/ai. All AI calls must go through the gateway."
            exit 1
          fi
          echo "OK: no model access outside the gateway."

  classification-coverage:
    # COMP-34: a personal-data column with no data_classification row is a
    # compliance gap, so it fails the build rather than waiting for an audit.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Every personal-data column is classified
        run: |
          psql -h localhost -p 5433 -U postgres -c 'CREATE DATABASE hrms'
          # EVERY migration, in order. Naming one file meant this gate kept
          # checking an older schema than the one that ships, so a constraint or
          # column added by a later migration was never seen here at all.
          for f in $(ls packages/db/migrations/*.sql | sort); do
            echo "applying $f"
            psql -h localhost -p 5433 -U postgres -d hrms -v ON_ERROR_STOP=1 -f "$f"
          done
          # Exclusions are table.column, never a bare column name: a bare
          # exclusion silently protects nothing in every future table.
          # They are applied here, not inside the query: psql -c does not
          # interpolate :'vars', and a second -c prints its command tag
          # ("SET") into the output, which was then read back as a bogus
          # unclassified column. `grep .` drops blank lines -- one blank line
          # in a -f pattern file matches everything and would silently
          # disable this check.
          MISSING=$(psql -h localhost -p 5433 -U postgres -d hrms -tAqc "
            SELECT c.table_name || '.' || c.column_name
              FROM information_schema.columns c
              JOIN information_schema.tables t
                ON t.table_schema = c.table_schema AND t.table_name = c.table_name
              LEFT JOIN data_classification dc
                ON dc.table_name = c.table_name AND dc.column_name = c.column_name
             WHERE c.table_schema = 'public'
               -- Base tables only. A VIEW stores nothing, so it has no retention
               -- clock and nothing to erase; its columns are classified on the
               -- table underneath. Two classification rows for one stored column
               -- drift apart. The test suite asserts separately that every view
               -- column DOES resolve to a classified base-table column, so this
               -- is a scope decision, not an exemption.
               AND t.table_type = 'BASE TABLE'
               AND EXISTS (SELECT 1 FROM information_schema.columns tc
                            WHERE tc.table_name = c.table_name
                              AND tc.column_name = 'tenant_id')
               AND dc.column_name IS NULL" \
            | grep -vxFf <(grep . packages/db/nonpersonal-columns.txt) || true)
          if [ -n "$MISSING" ]; then
            echo "::error::Unclassified personal-data columns: $MISSING"
            exit 1
          fi
          echo "OK: all personal-data columns classified."
